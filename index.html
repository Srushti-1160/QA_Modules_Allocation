<html lang="en">
<head>

<title>UAT v6.4.1(10) – Module Allocation</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--pagebg:linear-gradient(180deg,#b9d7c6 0,#d7e9de 520px,#e9f2ec 100%);--list:#fbf8f3;--listhead:#dcecdf;--listth:#f1eee6;--sidebg:#fbf8f3;--bg:#e6f0e9;--surface:#fdfbf7;--ink:#1f2421;--muted:#6f7a72;--line:#e7e2d7;--hero1:#5b7d65;--hero2:#3e5b49;--tile:#36513f;--accent:#e0782a;--sel:#3f5e4b;--c-done:#3f9a52;--c-done-bg:#e3f2e4;--c-pend:#d9731f;--c-pend-bg:#fbeedf;--c-nd:#a51d4a;--c-nd-bg:#f8e3ea;
--c-done:#2f9a5b;--c-done-bg:#e3f4ea;--c-prog:#3a6fd1;--c-prog-bg:#e6eefb;--c-pend:#d07a2a;--c-pend-bg:#fbefe2;--c-ns:#5f6b70;--c-ns-bg:#eef1f2;--c-ne:#6a4fc2;--c-ne-bg:#eeeafb;--c-nd:#c0394b;--c-nd-bg:#fbe6e9;--c-nn:#22908f;--c-nn-bg:#e0f3f2;--c-x:#7a6a3a;--c-x-bg:#f4efe2;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--pagebg,var(--bg));background-color:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:15px;line-height:1.5}
.wrap{max-width:1400px;margin:0 auto;padding:20px}
.hero{background:linear-gradient(180deg,#b5d5c2 0,#c4dfcf 300px,#d3e7da 100%);color:var(--ink);border-radius:28px;padding:0 0 26px;position:relative;overflow:hidden}
.htop{padding:34px 40px 0;position:relative;z-index:1}
.tag{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.55);color:#2f4a3a;border-radius:999px;padding:6px 14px;font-weight:700;font-size:13px;letter-spacing:.04em}

.scene{display:block;width:100%;height:250px;margin-top:-70px}
.stats{padding:0 26px;margin-top:-6px;position:relative;z-index:1}

.pills{display:flex;flex-wrap:wrap;align-items:center;gap:2px;margin:24px 0 16px}

.btn{font:inherit;font-weight:600;padding:12px 20px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.layout{display:grid;grid-template-columns:260px 1fr;gap:28px;align-items:start}

.av{width:38px;height:38px;border-radius:12px;display:inline-grid;place-items:center;font-size:17px;font-weight:800;flex:none}

table{width:100%;border-collapse:collapse;min-width:680px}

select.s{appearance:none;-webkit-appearance:none;font:inherit;font-size:13px;font-weight:600;border:1px dashed var(--line);border-radius:999px;padding:5px 26px 5px 12px;cursor:pointer;background-color:transparent;color:var(--muted);

select.s.has{border-style:solid;border-color:transparent}
select.s:focus-visible,.btn:focus-visible,.pill:focus-visible,.side button:focus-visible,.search input:focus-visible{outline:2px solid var(--c-prog);outline-offset:2px}
.mtag{display:inline-block;font-size:11px;font-weight:700;color:var(--c-x);background:var(--c-x-bg);border-radius:6px;padding:1px 7px;margin-right:8px;vertical-align:1px}

.card h3 .notebtn:focus-visible{outline:2px solid var(--c-prog);outline-offset:2px}
td.nt{color:var(--muted);font-size:14px;min-width:260px}
td.tb{min-width:130px}
.nwrap{display:flex;gap:6px;align-items:center}
.nsend{flex:none;width:30px;height:30px;border-radius:50%;border:0;background:var(--sel);color:#fff;cursor:pointer;display:grid;place-items:center;padding:0}

input.noteinp{flex:1;min-width:0;width:100%;font:inherit;font-size:14px;padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}

.card h3 .addbtn{width:34px;height:34px;border-radius:50%;border:1px solid rgba(255,255,255,.5);background:rgba(255,255,255,.75);color:#13260f;font:inherit;font-size:20px;line-height:1;cursor:pointer;display:grid;place-items:center}

.card h3 .addbtn:focus-visible{outline:2px solid var(--c-prog);outline-offset:2px}

.grip{cursor:grab;color:var(--muted);margin-right:8px;user-select:none;font-size:14px;padding:2px 2px;border-radius:4px}

tr.dragging{opacity:.4}
tr.over td{box-shadow:inset 0 2px 0 var(--c-prog)}

.card.over{outline:2px dashed var(--c-prog);outline-offset:4px}
.side button.over{outline:2px dashed var(--c-prog)}
.none{color:var(--muted);margin:16px 0 0}
.mtag.rtag{color:var(--c-prog);background:var(--c-prog-bg)}
tr.hassub td,tr.subrow:not(.last) td{border-bottom-color:transparent}

.tog{border:0;background:var(--listth);color:var(--muted);width:22px;height:22px;border-radius:6px;margin-left:8px;cursor:pointer;font-size:12px;line-height:22px;padding:0;vertical-align:1px}
.tog:hover{color:var(--ink)}
.tog:focus-visible{outline:2px solid var(--c-prog);outline-offset:2px}
.mtag.ptag{color:#2f6f8f;background:#e2eff5}

.mtag.ttag{color:var(--c-nn);background:var(--c-nn-bg)}
.mtag.ftag{color:var(--c-ne);background:var(--c-ne-bg)}
.btn.primary{background:var(--sel);color:#fff;border-color:transparent}
.btn:disabled{opacity:.6;cursor:default}
.chip{display:inline-block;font-size:13px;font-weight:600;border-radius:999px;padding:5px 12px}
select.assign,.pv select{font:inherit;font-size:14px;padding:7px 10px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);max-width:100%}

.dhead{display:flex;align-items:center;justify-content:space-between;padding:22px 26px 6px!important}

.drop{display:flex;flex-direction:column;gap:4px;align-items:center;justify-content:center;border:2px dashed var(--line);border-radius:18px;padding:26px;margin:14px 0 18px;cursor:pointer;text-align:center}
.drop:hover{border-color:var(--c-prog)}
.drop input{position:absolute;opacity:0;width:1px;height:1px}
.drop:focus-within{outline:2px solid var(--c-prog);outline-offset:2px}
.drop span{color:var(--muted);font-size:14px}
.lbl{display:block;font-weight:600;font-size:14px;margin-bottom:6px}
#impText{width:100%;font:inherit;font-size:14px;border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:var(--bg);color:var(--ink);resize:vertical}
.impmsg{min-height:20px;font-size:14px;color:var(--muted);margin:8px 0 0}.impmsg.err{color:var(--c-nd)}
.dfoot{display:flex;justify-content:flex-end;gap:10px;padding:14px 0 24px}
.pvsum{color:var(--muted);margin:10px 0}
.pvwrap{max-height:52vh;overflow:auto;border:1px solid var(--line);border-radius:14px}
table.pv{min-width:0}

.pv select{width:100%}
.pvname{width:100%;font:inherit;font-size:14px;border:1px solid transparent;border-radius:8px;padding:6px 8px;background:transparent;color:var(--ink)}

.sidehead{display:flex;align-items:center;justify-content:space-between;margin:0 0 10px 10px}
.sidehead h2{margin:0!important}
.side .sidetog{width:30px;height:30px;padding:0;justify-content:center;align-items:center;border-radius:50%;background:var(--bg);color:var(--ink);font-size:18px;line-height:1;font-weight:600}
.side .sidetog:hover{background:var(--sel);color:#fff}
.layout.closed{grid-template-columns:54px 1fr}

.overview{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
.ov{background:#fbf8f3;border-radius:22px;padding:16px 20px;border:2px solid transparent}
.ov.on{border-color:#7fae8f}
.ov h2{margin:0 0 8px;font-size:16px;color:#24392c}

.ovbar{grid-column:1/-1;height:6px;border-radius:99px;background:#efe9de;overflow:hidden}.ovbar span{display:block;height:100%;background:#5fae6e;border-radius:99px}

.bsel{display:inline-flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 6px 4px 14px;font-weight:600;font-size:14px;color:var(--muted)}

async function fileLines(f){const ext=(f.name.split(".").pop()||"").toLowerCase();

function guess(lines,mods){const names=mods.map(m=>m.name);const byLow=new Map(names.map(n=>[norm(n),n]));

  names.forEach(n=>{if(low.includes(norm(n))&&(!best||n.length>best.length))best=n;});
  if(!best){for(const [k,v] of ALIAS){if(low.includes(k)&&byLow.has(norm(v))){best=byLow.get(norm(v));break;}}}
  const st=statuses().find(s=>low.includes(s.toLowerCase()))||"";
  let feat=l;if(st)feat=feat.replace(new RegExp(st.replace(/[-]/g,"\\-"),"i"),"");feat=feat.split("|").map(x=>x.trim()).filter(Boolean).filter(x=>!statuses().some(s=>norm(s)===norm(x)))[0]||l;

async function aiSort(lines,mods){const sample=await getSample();if(!sample)return null;

${JSON.stringify(lines.map((l,i)=>({line:i,text:l})))}
Return ONLY a JSON array. One object per real feature, in line order:
{"line": number, "feature": "short feature name in the user's own words, without status words or tester names", "module": "one allowed module, or null if no module clearly fits", "status": "one allowed status if the line states it, else empty string", "testedBy": "tester names if the line states them, else empty string"}

  if(p.module)saved.features.push({...it,module:p.module});else saved.unmatched.push(it);});
 persist();removeFeatures();insertFeatures();render();dlg.close();});
function guessName(){const t=saved.view.track,s=saved.view.stage[t];const L=saved.builds[stageKey()]||[];const inc=n=>{const m=/^(.*)\((\d+)\)\s*$/.exec(n);return m?`${m[1]}(${+m[2]+1})`:n+" (2)";};
 if(L.length)return inc(L[L.length-1]);const first=TRACKS[t].stages[0][0];if(s!==first){const P0=saved.builds[t+"|"+first]||[];if(P0.length)return P0[P0.length-1];}
 for(const k in saved.builds){const X=saved.builds[k];if(X.length)return X[X.length-1];}return "v6.4.1(1)";}
function askText({title,label,value="",ok="Save",check}){return new Promise(res=>{const d=document.getElementById("askDlg"),inp=document.getElementById("askInp"),err=document.getElementById("askErr");
 document.getElementById("askTitle").textContent=title;document.getElementById("askLbl").textContent=label;document.getElementById("askOk").textContent=ok;inp.value=value;err.textContent="";
 const done=v=>{d.close();cleanup();res(v);};
 const submit=e=>{e.preventDefault();const v=inp.value.trim();if(!v){err.textContent="Please enter a value.";return;}const m=check&&check(v);if(m){err.textContent=m;return;}done(v);};
 const cancel=()=>done(null);
 const f=document.getElementById("askForm");f.addEventListener("submit",submit);document.getElementById("askCancel").addEventListener("click",cancel);d.addEventListener("cancel",cancel);
 function cleanup(){f.removeEventListener("submit",submit);document.getElementById("askCancel").removeEventListener("click",cancel);d.removeEventListener("cancel",cancel);}
 d.showModal();inp.focus();inp.select();});}
function newBuild(){const t=saved.view.track;const sk=stageKey();const L0=saved.builds[sk]||[];
 askText({title:"Add new build",label:`Build number for ${TRACKS[t].label} › ${stageLabel()}`,value:guessName(),ok:"Add build",check:n=>L0.includes(n)?"That build already exists in this stage.":null}).then(n=>{if(!n)return;
  const L=saved.builds[sk]=saved.builds[sk]||[];L.push(n);saved.view.build[sk]=n;saved.bstatus[sk+"|"+n]={};persist();render();});}
function renderOverview(){document.getElementById("overview").innerHTML=Object.entries(TRACKS).map(([tk,T])=>`<div class="ov${saved.view.track===tk?" on":""}"><h2>${T.label}</h2>${T.stages.map(([sk,sn])=>{const L=saved.builds[tk+"|"+sk]||[];const last=L[L.length-1];
  if(!last)return `<div class="ovl none"><span class="ovs">${sn}</span><span class="ovb">No build yet</span></div>`;
  const s=calcFor(tk+"|"+sk+"|"+last,"both",tk);const pc=s.total?Math.round(s.done/s.total*100):0;
  return `<button class="ovl" data-goto="${esc(tk+"|"+sk+"|"+last)}"><span class="ovs">${sn}</span><span class="ovb">${esc(last)}</span><span class="ovn">${s.done}/${s.total} done</span><span class="ovbar"><span style="width:${pc}%"></span></span></button>`;}).join("")}</div>`).join("");}
function renderBuildbar(){const t=saved.view.track,s=saved.view.stage[t];const L=saved.builds[stageKey()]||[];const B=curBuild();const cb=B?B.split("|")[2]:"";
 const other=t==="saas"?"vantara":"saas";
 document.getElementById("buildbar").innerHTML=`<h2 class="trk">${TRACKS[t].label}</h2>
 <div class="seg" role="group" aria-label="Stage">${TRACKS[t].stages.map(([k,n])=>`<button class="segb" data-stage="${k}" aria-pressed="${s===k}">${n}</button>`).join("")}</div>
 ${t==="saas"&&s==="prod"?`<div class="rel"><button class="relbtn" id="relbtn" aria-haspopup="listbox" aria-expanded="${relOpen}"><span class="relic" style="color:${SUBI[saved.view.sub].c};background:${SUBI[saved.view.sub].bg}">${SUBI[saved.view.sub].ic}</span><span class="reltx"><small>Release</small><b>${SUBS[saved.view.sub]}</b></span><svg class="chev" width="12" height="8" viewBox="0 0 12 8" aria-hidden="true"><path d="M1 1l5 5 5-5" fill="none" stroke="currentColor" stroke-width="1.8"/></svg></button>${relOpen?`<div class="relmenu" role="listbox" aria-label="Production release">${Object.entries(SUBS).map(([k,n])=>`<button class="relopt" role="option" aria-selected="${saved.view.sub===k}" data-sub="${k}"><span class="relic" style="color:${SUBI[k].c};background:${SUBI[k].bg}">${SUBI[k].ic}</span><span class="reltx"><b>${n}</b></span>${saved.view.sub===k?`<span class="relchk" aria-hidden="true">✓</span>`:""}</button>`).join("")}</div>`:""}</div>`:""}
 <div class="rel"><button class="relbtn" id="bldbtn" aria-haspopup="listbox" aria-expanded="${bldOpen}"${L.length?"":" disabled"}><span class="relic" style="color:#a9601c;background:#fbeedf"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 8l-9-5-9 5 9 5 9-5z"/><path d="M3 8v8l9 5 9-5V8"/><path d="M12 13v8"/></svg></span><span class="reltx"><small>Build</small><b>${L.length?esc(cb):"No build yet"}</b></span><svg class="chev" width="12" height="8" viewBox="0 0 12 8" aria-hidden="true"><path d="M1 1l5 5 5-5" fill="none" stroke="currentColor" stroke-width="1.8"/></svg></button>${bldOpen&&L.length?`<div class="relmenu bldmenu" role="listbox" aria-label="Build">${[...L].reverse().map((bn,i)=>`<button class="relopt" role="option" aria-selected="${bn===cb}" data-bld="${esc(bn)}"><span class="reltx"><b>${esc(bn)}</b></span>${i===0?`<span class="latest">Latest</span>`:""}${bn===cb?`<span class="relchk" aria-hidden="true">✓</span>`:`<span class="relchk"></span>`}</button>`).join("")}</div>`:""}</div>
 <button class="btn sm2" id="newb">+ New build</button><button class="btn sm2 switch" data-track="${other}">Switch to ${TRACKS[other].label} →</button>`;}
const T_label=t=>TRACKS[t].label;
function renderModList(){const t=saved.view.track;const off=saved.off[t];document.getElementById("modTitle").textContent=`Modules in ${TRACKS[t].label} build`;
 document.getElementById("modList").innerHTML=moduleNames().map(m=>{const k=norm(m.name);return `<label class="mrow"><input type="checkbox" data-mod="${esc(k)}"${off[k]?"":" checked"}><span>${esc(m.name)}</span><small>${esc([...m.people].join(", "))}</small></label>`;}).join("");}
document.addEventListener("click",e=>{
 const tb=e.target.closest("[data-track]");if(tb){saved.view.track=tb.dataset.track;persist();render();return;}
 const sb2=e.target.closest("[data-stage]");if(sb2){saved.view.stage[saved.view.track]=sb2.dataset.stage;persist();render();return;}
 const go=e.target.closest("[data-goto]");if(go){const [tk,sk,b]=go.dataset.goto.split("|");saved.view.track=tk;saved.view.stage[tk]=sk;saved.view.build[tk+"|"+sk]=b;persist();render();return;}
 if(e.target.closest("#newb,#newb2")){newBuild();return;}
 if(e.target.closest("#relbtn")){relOpen=!relOpen;bldOpen=false;renderBuildbar();return;}
 if(e.target.closest("#bldbtn")){bldOpen=!bldOpen;relOpen=false;renderBuildbar();return;}
 const bo=e.target.closest("[data-bld]");if(bo){saved.view.build[stageKey()]=bo.dataset.bld;bldOpen=false;persist();render();return;}
 const ro=e.target.closest(".relopt");if(ro){saved.view.sub=ro.dataset.sub;relOpen=false;persist();render();return;}
 if((relOpen||bldOpen)&&!e.target.closest(".rel")){relOpen=false;bldOpen=false;renderBuildbar();}
});
document.addEventListener("change",e=>{
  if(e.target.id==="bsel"){saved.view.build[stageKey()]=e.target.value;persist();render();return;}
 const mc=e.target.closest("input[data-mod]");if(mc){const off=saved.off[saved.view.track];if(mc.checked)delete off[mc.dataset.mod];else off[mc.dataset.mod]=true;persist();render();}
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&(relOpen||bldOpen)){const id=relOpen?"relbtn":"bldbtn";relOpen=false;bldOpen=false;renderBuildbar();const b=document.getElementById(id);if(b)b.focus();}});
if(ONLINE){
 persist();
 setInterval(()=>{const ae=document.activeElement;if(document.querySelector("dialog[open]")||(ae&&/INPUT|SELECT|TEXTAREA/.test(ae.tagName))||relOpen||bldOpen||dragId)return;
  fetch("/api/state",{credentials:"same-origin"}).then(r=>r.ok?r.json():null).then(s=>{if(!s)return;
   const docNow=stable(docOf(saved)),docSrv=stable(docOf(s.doc||{}));
   if(docNow!==docSrv){location.reload();return;}
   saved.status=s.status||{};saved.bstatus=s.bstatus||{};saved.notes=s.notes||{};LAST=snap();render();}).catch(()=>{});},20000);
 if(!ME)setTimeout(()=>askText({title:"Welcome",label:"Your name (so the team knows who changed what)",ok:"Continue"}).then(n=>{if(n){ME=n;try{localStorage.setItem("uat-user",n);}catch(e){}}}),300);
}
render();
</script>
